# General
base_url = "https://maxgfr.github.io"
theme = "anemone"
compile_sass = false
minify_html = true
generate_feeds = true
generate_sitemap = true

# Taxonomies
taxonomies = [
    {name = "tags", feed = true, paginate_by = 10},
]

# Language
default_language = "fr"

[languages.fr]
build_search_index = true
title = "Maxime Golfier"
description = "Ingénieur IT - Développeur Logiciel Indépendant, CTO, et Architecte de Solutions IT. Création de solutions innovantes et d'architecture de systèmes."

[languages.en]
build_search_index = true
title = "Maxime Golfier"
description = "IT Engineer - Independent Software Developer, CTO, and IT Solutions Architect. Building innovative solutions and systems architecture."

[markdown]
render_emoji = true
external_links_target_blank = true
smart_punctuation = true

[slugify]
paths = "on"
taxonomies = "on"
anchors = "off"

[link_checker]
internal_level = "warn"

# Extra
[extra]
author = "Maxime Golfier"
favicon = "favicon.ico"
list_pages = false
twitter_card = true
enable_search = true

## Navigation
header_nav = [
  { url = "/", name_en = "/home", name_fr = "/accueil", short_en = "/~", short_fr = "/~" },
  { url = "/experience", name_en = "/experience", name_fr = "/expérience", short_en = "/xp", short_fr = "/xp" },
  { url = "/education", name_en = "/education", name_fr = "/formation", short_en = "/lvl", short_fr = "/lvl" },
  { url = "/skills", name_en = "/skills", name_fr = "/compétences", short_en = "/++", short_fr = "/++" },
  { url = "/projects", name_en = "/projects", name_fr = "/projets", short_en = "/oss", short_fr = "/oss" },
  { url = "/cv", name_en = "/cv", name_fr = "/cv", short_en = "/cv", short_fr = "/cv" },
  { url = "/contact", name_en = "/contact", name_fr = "/contact", short_en = "/@", short_fr = "/@" }
]

## The /projects views. One nav entry (/projects) leads to all of them; this list
## drives the in-page switcher rendered by templates/macros/projects.html, in this
## order. The first entry is the default view and the one the nav points at.
##
## Adding a view means: an entry here, templates/projects-<name>.html, and BOTH
## content/projects-<name>.md and content/projects-<name>.en.md — static/js/language.js
## redirects between /x and /en/x, so a missing twin is a 404, not a fallback.
projects_views = [
  { url = "/projects", name_en = "list", name_fr = "liste" },
  { url = "/projects-cards", name_en = "cards", name_fr = "cartes" },
  { url = "/projects-dex", name_en = "pokédex", name_fr = "pokédex" },
  { url = "/projects-shell", name_en = "shell", name_fr = "shell" }
]

## Pokémon type labels for /projects-dex. Presentation, not data: the generator
## emits type NAMES ("water") into data/projects.json and the colours live in
## static/css/projects-dex.css, so this is only the bilingual wording and the icon.
## It sits here rather than in the template because Tera v2 dropped macros, which
## makes an eighteen-branch {% if %} chain the only alternative.
## The keys must match TYPE_BY_LANGUAGE / TYPE_BY_TOPIC in
## .github/scripts/generate-projects.mjs.
[extra.poke_types]
normal = { fr = "Normal", en = "Normal", icon = "⬜" }
fire = { fr = "Feu", en = "Fire", icon = "🔥" }
water = { fr = "Eau", en = "Water", icon = "💧" }
electric = { fr = "Électrik", en = "Electric", icon = "⚡" }
grass = { fr = "Plante", en = "Grass", icon = "🌱" }
ice = { fr = "Glace", en = "Ice", icon = "❄️" }
fighting = { fr = "Combat", en = "Fighting", icon = "🥊" }
poison = { fr = "Poison", en = "Poison", icon = "🧪" }
ground = { fr = "Sol", en = "Ground", icon = "🏔️" }
flying = { fr = "Vol", en = "Flying", icon = "🕊️" }
psychic = { fr = "Psy", en = "Psychic", icon = "🔮" }
