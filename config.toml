## CV — data that exists nowhere else on the site (the rest of the CV page is
## assembled from content/*.md by templates/cv.html, so it can never drift).
[extra.cv]
github = "https://github.com/maxgfr"
linkedin = "https://www.linkedin.com/in/maxime-golfier/"
# The site's own address, spelled out rather than taken from `base_url`:
# render-cv-pdf.mjs builds against a loopback base_url (see the comment in that
# script), so `config.base_url` would bake http://127.0.0.1:PORT into the link
# of every published PDF.
website = "https://maxgfr.github.io"
title_fr = "Ingénieur logiciel full-stack freelance — TypeScript / React / Node.js"
title_en = "Freelance full-stack software engineer — TypeScript / React / Node.js"
location_fr = "France · remote ou hybride"
location_en = "France · remote or hybrid"
# An ATS that finds no address in the header often drops the application, so the
# PDF carries an email. The website does not: templates/cv.html renders this
# entry print-only, so /cv shows no address on screen and contact still goes
# through the /contact form.
#
# Stored XOR-obfuscated (key below), never in clear. That keeps a plain address
# out of three places at once: this file, which is public on GitHub; the served
# HTML, where `\S+@\S+` is all a bulk harvester looks for; and the site's search
# index. It is a speed bump, not protection — anything that runs the page's JS
# can still read it. Regenerate with:
#   node -e '\''const e="you@example.com",k="cv";console.log([...e].map((c,i)=>(c.charCodeAt(0)^k.charCodeAt(i%k.length)).toString(16).padStart(2,"0")).join(""))'\''
email_key = "cv"
email_obfuscated = "0e171b110c1a051f060423110e170a1a4d150c1b"
